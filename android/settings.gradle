pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // DJI MSDK V5 artifacts (5.11.0+) are on Maven Central.
        // developer.dji.com/maven2 returns 403 from CI; omitted.
        maven { url "https://jitpack.io" }
    }
}

rootProject.name = "SClassFencingApp"
include ':app'
