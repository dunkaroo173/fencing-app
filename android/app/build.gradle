plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sclassfencing.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.sclassfencing.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
        // Force DJI Helper into the primary DEX so it's available before MultiDex.install()
        multiDexKeepProguard file('multidex-keep.pro')

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/*.kotlin_module',
                'META-INF/proguard/**'
            ]
        }
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    // DJI MSDK V5 — aircraft contains native libs; provided contains API + Helper.
    // Both must be implementation so Helper is in the APK.
    // Pure reflection in DJIApplication means no DJI class is referenced in bytecode,
    // so ART never eagerly loads the stubs. Helper.install() patches the ClassLoader
    // with real SDK classes before any dji.v5.* class is touched via Class.forName.
    implementation('com.dji:dji-sdk-v5-aircraft:5.11.0') {
        exclude module: 'library-anti-distortion'
        exclude module: 'fly-safe-database'
    }
    implementation('com.dji:dji-sdk-v5-aircraft-provided:5.11.0')

    // AndroidX core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'

    // UI
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Unit tests
    testImplementation 'junit:junit:4.13.2'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // ViewPager2 for tournament tabs
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
}
