apply plugin: 'com.android.application'

android {
    namespace 'io.github.dunkaroo173.uflfencing'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.dunkaroo173.uflfencing'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-video:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'androidx.camera:camera-effects:1.5.3'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
            details.because 'Keep Kotlin transitive runtime artifacts aligned for AndroidX dependencies.'
        }
    }
}

tasks.register('syncUflAndroidAssets', Copy) {
    from("$rootDir/../ufl-android")
    into("$projectDir/src/main/assets/public")
}

tasks.named('preBuild') {
    dependsOn(tasks.named('syncUflAndroidAssets'))
}
