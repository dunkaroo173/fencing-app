<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>UFL Fencing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Exo+2:wght@600;700;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080c;--s1:#0d0f16;--s2:#141720;
  --border:#252a38;
  --L:#00c7ff;--L2:rgba(0,199,255,0.18);--L3:rgba(0,199,255,0.7);
  --R:#e62600;--R2:rgba(230,38,0,0.18);--R3:rgba(230,38,0,0.7);
  --gold:#f5c842;--green:#3de87a;--warn:#f5a623;
  --text:#d0d6e8;--muted:#6a738a;
  --mono:'Share Tech Mono',monospace;
  --head:'Exo 2',sans-serif;
  --body:'Rajdhani',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body)}
button{cursor:pointer;border:none;background:none;color:inherit;font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#portrait-overlay{display:none;position:absolute;inset:0;background:#000;z-index:9999;align-items:center;justify-content:center;font-size:16px;letter-spacing:2px;color:#fff;font-family:monospace;pointer-events:none}
#portrait-overlay.on{display:flex;pointer-events:none}
.app-root{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* ── SCREEN 0: SETUP ── */
#s-setup{flex-direction:row;background:linear-gradient(135deg,#07080c 60%,#0a0e18)}
.setup-col{width:140px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:20px 10px;position:relative;overflow:hidden}
.setup-col.left{background:linear-gradient(180deg,var(--L3) 0%,rgba(0,199,255,0.04) 100%)}
.setup-col.right{background:linear-gradient(180deg,var(--R3) 0%,rgba(230,38,0,0.04) 100%)}
.setup-avatar{width:70px;height:70px;border-radius:50%;background:var(--s2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:30px}
.setup-name-input{margin-top:10px;width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:8px 6px;color:#fff;font-family:var(--head);font-size:13px;font-weight:600;text-align:center;outline:none}
.setup-side-tag{margin-top:auto;width:100%;padding:12px 0;text-align:center;font-family:var(--head);font-weight:700;font-size:15px;color:#fff;border-radius:6px}
.setup-col.left .setup-side-tag{background:linear-gradient(90deg,rgba(10,67,255,0.1),var(--L))}
.setup-col.right .setup-side-tag{background:linear-gradient(90deg,var(--R),rgba(159,25,3,0.1))}
.setup-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:14px 10px}
.setup-score{font-family:var(--head);font-weight:800;font-size:36px;color:#fff;letter-spacing:6px}
.setup-opts{display:flex;flex-direction:column;gap:10px;width:100%}
.opt-row{display:flex;align-items:center;gap:8px;justify-content:center}
.opt-label{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:60px;text-align:right}
.chip-row{display:flex;gap:6px}
.chip{padding:7px 14px;border:1px solid var(--border);border-radius:4px;font-family:var(--mono);font-size:12px;color:var(--muted);background:rgba(255,255,255,0);transition:all .15s;min-width:44px;text-align:center}
.chip.active{background:rgba(255,255,255,0.45);color:#fff;border-color:rgba(255,255,255,0.4)}
.setup-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:220px}
.setup-video-status{min-height:14px;margin-top:8px;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.rnd{width:100%;padding:14px;border-radius:28px;font-family:var(--body);font-size:15px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;border:none;transition:all .12s}
.rnd:active{transform:scale(0.96)}
.rnd-start{background:#0a39d4;color:#fff}
.rnd-end{background:#111;color:#fff;border:1px solid var(--border)}
.rnd-red{background:#a82e15;color:#fff}
.rnd-grey{background:#444;color:#fff}
.rnd-blue{background:#0a39d4;color:#fff}

/* ── SCREEN 1: MATCH ── */
#s-match{background:var(--bg)}
.hud{height:58px;flex-shrink:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;padding:0 10px;gap:6px;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 100%,0 100%)}
.hud-av{width:38px;height:38px;border-radius:50%;background:var(--s2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.hud-info{flex:1;min-width:0;display:flex;flex-direction:column}
.hud-name{font-family:var(--head);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-hp{height:5px;background:var(--s2);border-radius:2px;margin-top:3px;overflow:hidden}
.hud-hp-fill{height:100%;border-radius:2px;transition:width .35s}
.hud-pts{font-family:var(--head);font-weight:800;font-size:22px;min-width:26px;text-align:center;flex-shrink:0}
.timer-wrap{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding:0 6px}
.timer-num{font-family:var(--mono);font-size:20px;color:var(--gold);letter-spacing:3px;line-height:1}
.timer-num.warn{color:var(--R);animation:blink .5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.period-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:2px}
.priority-badge{font-size:9px;background:var(--gold);color:#000;padding:1px 4px;border-radius:2px;font-family:var(--mono);font-weight:bold;display:none;margin-left:4px}
.priority-badge.on{display:inline}
.operate{flex:1;position:relative;overflow:hidden}
.cards-strip{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;padding:6px 12px;pointer-events:none;z-index:5}
.cards-l,.cards-r{display:flex;gap:4px;align-items:center;font-size:18px}
.cards-r{margin-left:auto;flex-direction:row-reverse}
.hint-center{flex:1;display:flex;justify-content:center}
.hint-pill{background:rgba(0,0,0,0.8);border:1px solid var(--border);padding:7px 18px;border-radius:20px;font-family:var(--head);font-weight:600;font-size:14px;color:#fff;display:none;max-width:280px;text-align:center}
.hint-pill.on{display:block}
.act-btn{position:absolute;width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;border:2px solid;transition:transform .1s}
.act-btn:active{transform:scale(0.9)}
.act-left{bottom:28px;left:36px;border-color:var(--L);background:var(--L2)}
.act-right{bottom:28px;right:36px;border-color:var(--R);background:var(--R2)}
.sec-btn{position:absolute;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:1.5px solid;transition:transform .1s}
.sec-btn:active{transform:scale(0.9)}
.foul-left{bottom:120px;left:54px;border-color:#ffaa00;background:rgba(255,170,0,0.12)}
.foul-right{bottom:120px;right:54px;border-color:#ffaa00;background:rgba(255,170,0,0.12)}
.chal-left{bottom:92px;left:12px;border-color:#00ffee;background:rgba(0,255,238,0.08);width:42px;height:42px;font-size:16px}
.chal-right{bottom:92px;right:12px;border-color:#00ffee;background:rgba(0,255,238,0.08);width:42px;height:42px;font-size:16px}
.mid-btn{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);padding:12px 28px;border-radius:24px;font-family:var(--body);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
#pause-btn{background:var(--R2);color:var(--R);border:1.5px solid var(--R)}
#resume-btn{background:#0a39d4;color:#fff;display:none}
.confirm-wrap{position:absolute;bottom:70px;display:none;flex-direction:column;gap:10px;align-items:center;z-index:30}
.confirm-wrap.on{display:flex}
.confirm-wrap.left-side{left:16px}
.confirm-wrap.right-side{right:16px}
.mark-circle{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,0.1);border:1.5px solid var(--border);font-size:20px;display:flex;align-items:center;justify-content:center;align-self:flex-end}
.confirm-wrap.right-side .mark-circle{align-self:flex-start}
.conf-btn{width:150px;padding:13px 0;border-radius:24px;font-family:var(--body);font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;text-align:center;transition:transform .1s}
.conf-btn:active{transform:scale(0.96)}
.conf-cancel{background:#111;color:#fff;border:1.5px solid #333}
.conf-confirm{background:#0a39d4;color:#fff}
.conf-hit{background:#15803d;color:#fff}
.conf-offtarget{background:#92400e;color:#fff}
.conf-label{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,0.7);letter-spacing:1px;text-align:center}

/* ── SVG RADIAL MENU ── */
#radial-overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:25;background:rgba(0,0,0,0.84);transition:opacity .2s;touch-action:none}
#r-svgwrap{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
#r-svg{display:block;touch-action:none;width:min(320px,92vmin);height:min(320px,92vmin)}
.radial-cancel-btn{margin-top:8px;background:transparent;border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.32);padding:7px 24px;border-radius:2px;font-size:9px;font-family:var(--mono);letter-spacing:2.5px}
@keyframes r-sector-in{from{opacity:0;transform:scale(.1)}to{opacity:1;transform:scale(1)}}
@keyframes r-sector-out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.1)}}
@keyframes r-pulse-ring{0%{r:138;opacity:.85}100%{r:168;opacity:0}}
.r-sector-in{animation:r-sector-in .32s cubic-bezier(.16,1,.3,1) forwards;transform-origin:160px 160px;transform-box:view-box}
.r-sector-out{animation:r-sector-out .18s ease-in forwards;transform-origin:160px 160px;transform-box:view-box}
.r-pulse-anim{animation:r-pulse-ring .65s ease-out forwards}

/* ── SCREEN 2: RESULT ── */
#s-result{flex-direction:column;background:var(--bg);justify-content:space-between;padding:16px}
.result-topbar{display:flex;justify-content:space-between;align-items:center}
.result-main{display:flex;justify-content:center;align-items:center;gap:30px;flex:1}
.res-fencer{display:flex;flex-direction:column;align-items:center;gap:8px}
.res-av{width:60px;height:60px;border-radius:50%;background:var(--s2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px}
.res-name{font-family:var(--head);font-size:15px;font-weight:600;color:#fff;text-align:center}
.res-scorebox{text-align:center}
.res-score-lbl{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:6px}
.res-score-num{font-family:var(--head);font-weight:800;font-size:44px;color:#fff;letter-spacing:8px;line-height:1}
.result-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ── SCREEN 3: EVENTS ── */
#s-events{background:rgba(0,0,0,0.9);flex-direction:row}
.ev-side{width:80px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:16px 6px}
.ev-side-name{font-family:var(--head);font-size:12px;font-weight:600;text-align:center;margin-top:8px}
.ev-side-tag{margin-top:auto;width:100%;padding:10px 0;text-align:center;font-family:var(--head);font-weight:700;font-size:13px;color:#fff;border-radius:4px}
.ev-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ev-divider{position:absolute;top:0;bottom:0;left:50%;width:1px;background:rgba(255,255,255,0.15)}
.ev-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0}
.ev-item{padding:8px 10px;display:flex;align-items:stretch}
.ev-bubble{border-radius:10px;padding:7px 12px;display:flex;gap:6px;align-items:center}
.ev-bubble.ev-l{background:linear-gradient(90deg,#0a386d,var(--L));border-top-right-radius:0;flex:1;margin-right:24px}
.ev-bubble.ev-r{background:linear-gradient(90deg,var(--R),#5c1a0a);border-top-left-radius:0;flex:1;margin-left:24px;flex-direction:row-reverse}
.ev-bubble.ev-c{background:linear-gradient(90deg,var(--L),var(--R));margin:0 20px;width:100%}
.ev-ts{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,0.7);flex-shrink:0}
.ev-hint{font-family:var(--body);font-size:12px;color:#fff;font-weight:500}
.ev-btm{padding:12px;display:flex;justify-content:center;flex-shrink:0}

/* ── SCREEN 4: COUNTDOWN ── */
#s-countdown{align-items:center;justify-content:center;background:rgba(0,0,0,0.88)}
.cd-num{font-family:var(--mono);font-size:96px;color:var(--gold);text-shadow:0 0 40px rgba(245,200,66,0.6);line-height:1}
.cd-sub{font-family:var(--mono);font-size:14px;color:var(--muted);margin-top:12px;letter-spacing:3px}

/* ── DRAWER ── */
.drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:50;display:none}
.drawer-backdrop.on{display:block}
.drawer{position:absolute;bottom:0;left:0;right:0;max-height:75vh;background:var(--s1);border-top:2px solid var(--border);border-radius:16px 16px 0 0;z-index:51;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s ease}
.drawer.on{transform:translateY(0)}
.drawer-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:10px auto 0}
.drawer-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.dtab{flex:1;padding:12px 4px;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s}
.dtab.active{color:var(--gold);border-bottom-color:var(--gold)}
.drawer-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.dpanel{display:none;padding:14px}
.dpanel.active{display:block}
.rpt-section{margin-bottom:16px}
.rpt-head{font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;padding-bottom:5px;border-bottom:1px solid var(--border);margin-bottom:8px}
.rpt-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--s2);font-size:14px}
.rpt-k{color:var(--muted)}.rpt-v{color:var(--text);font-weight:600}
.exp-row{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.exp-btn{padding:13px;border:1px solid var(--border);background:var(--s2);color:var(--text);font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border-radius:6px;text-align:center;transition:all .15s}
.exp-btn:active{background:var(--s1)}
.ai-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--s2);font-size:13px}
.ai-ts{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:42px;flex-shrink:0}
.ai-label{flex:1;line-height:1.3}
.conf{font-family:var(--mono);font-size:10px;padding:2px 5px;border-radius:2px;flex-shrink:0}
.conf-h{background:#00200f;color:var(--green)}.conf-m{background:#202000;color:var(--gold)}.conf-l{background:#200000;color:var(--R)}
.stat-bar-r{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px}
.stat-bar-l{color:var(--muted);min-width:120px;font-size:11px}
.stat-bar-b{height:7px;background:var(--gold);border-radius:2px;transition:width .4s;min-width:2px}
.stat-bar-n{font-family:var(--mono);font-size:11px;color:var(--text)}

/* ── CAMERA ── */
#cam-preview,#import-preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.28;z-index:0;display:none;pointer-events:none}
#cam-preview.on,#import-preview.on{display:block}
#import-preview{opacity:0.42}
.cam-btn{position:absolute;top:8px;right:8px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,0.6);border:1.5px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:10;cursor:pointer;transition:transform .1s}
.cam-btn:active{transform:scale(0.9)}
.cam-btn.recording{border-color:var(--R);background:rgba(230,38,0,0.3)}
.rec-dot{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;background:rgba(0,0,0,0.7);border-radius:12px;padding:4px 10px;z-index:10}
.rec-dot.on{display:flex}
.rec-circle{width:9px;height:9px;border-radius:50%;background:#e62600;animation:recblink .9s infinite}
@keyframes recblink{0%,100%{opacity:1}50%{opacity:.2}}
.rec-label{font-family:var(--mono);font-size:11px;color:#fff;letter-spacing:1px}
.fab{position:absolute;bottom:16px;right:16px;width:52px;height:52px;border-radius:50%;background:var(--gold);color:#000;display:flex;align-items:center;justify-content:center;font-size:22px;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,0.5);transition:transform .1s}
.fab:active{transform:scale(0.93)}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div id="portrait-overlay">⟳ ROTATE DEVICE</div>
<div class="app-root">

<!-- ── SCREEN 0: SETUP ── -->
<div id="s-setup" class="screen active">
  <div class="setup-col left">
    <div class="setup-avatar" id="av-l">🤺</div>
    <input class="setup-name-input" id="name-l" type="text" maxlength="18" placeholder="LEFT FENCER" autocomplete="off" spellcheck="false">
    <div class="setup-side-tag">LEFT</div>
  </div>
  <div class="setup-center">
    <div class="setup-score" id="score-disp">0 — 0</div>
    <div class="setup-opts">
      <div class="opt-row">
        <span class="opt-label">WEAPON</span>
        <div class="chip-row">
          <button class="chip active" data-group="wpn" data-val="foil">FOIL</button>
          <button class="chip" data-group="wpn" data-val="epee">ÉPÉE</button>
          <button class="chip" data-group="wpn" data-val="sabre">SABRE</button>
        </div>
      </div>
      <div class="opt-row">
        <span class="opt-label">PERIODS</span>
        <div class="chip-row">
          <button class="chip active" data-group="per" data-val="1">1</button>
          <button class="chip" data-group="per" data-val="2">2</button>
          <button class="chip" data-group="per" data-val="3">3</button>
        </div>
      </div>
      <div class="opt-row">
        <span class="opt-label">DURATION</span>
        <div class="chip-row">
          <button class="chip active" data-group="dur" data-val="3">3m</button>
          <button class="chip" data-group="dur" data-val="5">5m</button>
          <button class="chip" data-group="dur" data-val="9">9m</button>
        </div>
      </div>
      <div class="opt-row">
        <span class="opt-label">FORMAT</span>
        <div class="chip-row">
          <button class="chip active" data-group="fmt" data-val="DE">DE</button>
          <button class="chip" data-group="fmt" data-val="poule">POULE</button>
        </div>
      </div>
    </div>
    <div class="setup-btns">
      <button class="rnd rnd-start" id="btn-start">▶ START MATCH</button>
      <button class="rnd rnd-end" id="btn-import-video">⬆ IMPORT VIDEO</button>
      <button class="rnd rnd-end" id="btn-load">⬆ LOAD JSON</button>
      <input type="file" id="file-input" accept=".json" style="display:none">
    </div>
    <div class="setup-video-status" id="setup-video-status"></div>
  </div>
  <div class="setup-col right">
    <div class="setup-avatar" id="av-r">🤺</div>
    <input class="setup-name-input" id="name-r" type="text" maxlength="18" placeholder="RIGHT FENCER" autocomplete="off" spellcheck="false">
    <div class="setup-side-tag">RIGHT</div>
  </div>
</div>

<!-- ── SCREEN 1: MATCH ── -->
<div id="s-match" class="screen">
  <!-- Camera preview (behind everything) -->
  <video id="cam-preview" autoplay muted playsinline></video>

// ── Match state ───────────────────────────────────────────────────────────────
let M = null;
let PS = {left:null, right:null}; // pending pie selection {menuType, side}

function newMatchState(cfg) {
  return {
    nameL: cfg.nameL || 'LEFT',
    nameR: cfg.nameR || 'RIGHT',
    weapon: cfg.weapon || 'foil',
    format: cfg.format || 'DE',
    totalPeriods: cfg.periods || 1,
    periodDuration: cfg.duration * 60 || 180,
    period: 1,
    scoreL: 0, scoreR: 0,
    hpL: 100,  hpR: 100,
    cardsL: [], cardsR: [],
    timerSec: cfg.duration * 60 || 180,
    running: false,
    finished: false,
    events: [],
    recordingStartBoutTs: null,
    recordingStartPeriod: null,
    recordingStartPeriodTs: null,
    recordingPauses: [],
    startTime: null,
    elapsedMs: 0,
  };
}

// ── Screen helpers ────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(Number(sec) || 0));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function refreshHUD() {
  if (!M) return;
  document.getElementById('hud-name-l').textContent = M.nameL;
  document.getElementById('hud-name-r').textContent = M.nameR;
  document.getElementById('hud-pts-l').textContent  = M.scoreL;
  document.getElementById('hud-pts-r').textContent  = M.scoreR;
  const maxHP = 100;
  document.getElementById('hud-hp-l').style.width = (M.hpL / maxHP * 100) + '%';
  document.getElementById('hud-hp-r').style.width = (M.hpR / maxHP * 100) + '%';
  const t = document.getElementById('timer-disp');
  t.textContent = fmtTime(M.timerSec);
  t.className   = 'timer-num' + (M.timerSec <= 30 ? ' warn' : '');
  document.getElementById('period-lbl').textContent = `P${M.period}`;
  // Cards
  document.getElementById('cards-l').textContent = M.cardsL.join(' ');
  document.getElementById('cards-r').textContent = M.cardsR.join(' ');
}

// ── Timer ─────────────────────────────────────────────────────────────────────
let _timerInterval = null;

function startTimer() {
  if (_timerInterval) return;
  noteRecordingClockResume();
  M.running = true;
  resumeImportedVideo();
  _timerInterval = setInterval(() => {
    if (!M.running) return;
    if (M.timerSec > 0 || isImportedVideoAnnotationMode()) {
      M.timerSec--;
      refreshHUD();
    } else {
      clearInterval(_timerInterval);
      _timerInterval = null;
      M.running = false;
      endPeriod();
    }
  }, 1000);
}

function stopTimer() {
  noteRecordingClockPause();
  pauseImportedVideo();
  if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
  M.running = false;
}

function endPeriod() {
  if (M.period < M.totalPeriods) {
    M.period++;
    M.timerSec = M.periodDuration;
    showResultScreen('END OF PERIOD ' + (M.period - 1));
  } else {
    finishMatch();
  }
}

function finishMatch() {
  stopTimer();
  stopActiveRecording({ autoStop: true });
  M.finished = true;
  const winner = M.scoreL > M.scoreR ? M.nameL : M.scoreR > M.scoreL ? M.nameR : 'DRAW';
  showResultScreen(winner === 'DRAW' ? 'DRAW' : winner + ' WINS!');
  document.getElementById('res-resume').style.display = 'none';
  document.getElementById('fab-btn').style.display = 'flex';
}

// ── Countdown ─────────────────────────────────────────────────────────────────
const START_COUNTDOWN_SECONDS = 2.7;

function runCountdown(cb) {
  showScreen('s-countdown');
  let n = 3;
  document.getElementById('cd-num').textContent = n;
  const iv = setInterval(() => {
    n--;
    if (n > 0) {
      document.getElementById('cd-num').textContent = n;
    } else {
      clearInterval(iv);
      cb();
    }
  }, 900);
}

// ── Start / Resume ────────────────────────────────────────────────────────────
async function clickStart() {
  const nameL = document.getElementById('name-l').value.trim() || 'LEFT';
  const nameR = document.getElementById('name-r').value.trim() || 'RIGHT';
  M = newMatchState({ nameL, nameR, ...CFG });
  refreshHUD();
  document.getElementById('hud-name-l').textContent = nameL;
  document.getElementById('hud-name-r').textContent = nameR;
  showScreen('s-match');
  document.getElementById('pause-btn').style.display  = 'block';
  document.getElementById('resume-btn').style.display = 'none';
  attachImportedVideoPreview(true);
  if (!isImportedVideoAnnotationMode()) await prepareRecordingBeforeStart();
  runCountdown(() => {
    showScreen('s-match');
    document.getElementById('pause-btn').style.display  = 'block';
    document.getElementById('resume-btn').style.display = 'none';
    startTimer();
  });
}

document.getElementById('btn-start').addEventListener('touchend', e => {
  e.preventDefault(); clickStart();
}, {passive:false});

// ── Result / Pause screen ─────────────────────────────────────────────────────
function showResultScreen(title) {
  document.getElementById('res-title').textContent  = title;
  document.getElementById('res-weapon').textContent = (M.weapon || 'FOIL').toUpperCase();
  document.getElementById('res-name-l').textContent = M.nameL;

// Geometry constants (viewBox 320×320, center 160,160)
const _CX=160,_CY=160,_OR=134,_IR=50,_GAP=3;
const _LR=_IR+(_OR-_IR)*0.5, _IDR=_IR+(_OR-_IR)*0.18;
const _d2r=a=>((a-90)*Math.PI)/180;
const _pt=(r,a)=>[_CX+r*Math.cos(_d2r(a)),_CY+r*Math.sin(_d2r(a))];
const _f=n=>n.toFixed(2);

function _arcPath(s,e,outerR,innerR,gap){
  outerR=outerR??_OR; innerR=innerR??_IR; gap=gap??_GAP;
  const sa=s+gap,ea=e-gap,la=ea-sa>180?1:0;
  const[ox1,oy1]=_pt(outerR,sa),[ox2,oy2]=_pt(outerR,ea);
  const[ix1,iy1]=_pt(innerR,sa),[ix2,iy2]=_pt(innerR,ea);
  return`M${_f(ix1)},${_f(iy1)} L${_f(ox1)},${_f(oy1)} A${outerR},${outerR} 0 ${la},1 ${_f(ox2)},${_f(oy2)} L${_f(ix2)},${_f(iy2)} A${innerR},${innerR} 0 ${la},0 ${_f(ix1)},${_f(iy1)}Z`;
}

function _svgEl(tag,attrs){
  const el=document.createElementNS('http://www.w3.org/2000/svg',tag);
  for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);
  return el;
}

// Radial state
let _radSide=null,_radPhase='idle',_radMenu=null,_radStack=[],_radHov=null,_radEls=[];
let _rSlicesG,_rCenterDisc,_rCenterTop,_rCenterBot,_rIndicator,_rPulseRing,_rTrack1,_rTrack2;

function _radBuildSlices(menuKey){
  const def=RADIAL_DEFS[menuKey]; if(!def) return [];
  const n=def.sectors.length;
  const col=def.color||'#888', dark=def.dark||'#111';
  const els=[];
  // Ensure gradient exists in defs
  const svgEl=document.getElementById('r-svg');
  const defs=svgEl.querySelector('defs');
  const gradId='rg-'+menuKey.toLowerCase();
  if(!document.getElementById(gradId)){
    const rg=_svgEl('radialGradient',{id:gradId,cx:'50%',cy:'50%',r:'50%'});
    rg.appendChild(_svgEl('stop',{'offset':'0%','stop-color':col,'stop-opacity':'.5'}));
    rg.appendChild(_svgEl('stop',{'offset':'100%','stop-color':col,'stop-opacity':'.1'}));
    defs.appendChild(rg);
  }
  def.sectors.forEach((sec,i)=>{
    const sz=360/n,s=sz*i,e=sz*(i+1),mid=sz*i+sz/2;
    const sc=sec.color||col, sd=sec.dark||dark;
    const[lx,ly]=_pt(_LR,mid),[bx,by]=_pt(_IDR,mid);
    const g=_svgEl('g',{});
    g.style.display='none'; g.style.opacity='0';
    g.style.transformOrigin=`${_CX}px ${_CY}px`;
    const glow=_svgEl('path',{d:_arcPath(s,e,_OR+16,_IR-3,_GAP-1),fill:sc,opacity:'.08'});
    glow.style.display='none'; glow.style.pointerEvents='none';
    g.appendChild(glow);
    const arc=_svgEl('path',{d:_arcPath(s,e,_OR,_IR),fill:sd,stroke:sc,'stroke-width':'.45'});
    arc.style.pointerEvents='none'; arc.style.transition='all .13s ease';
    g.appendChild(arc);
    const idTxt=_svgEl('text',{x:bx,y:by,'text-anchor':'middle','dominant-baseline':'middle',
      fill:sc,opacity:'.6','font-size':'7','font-family':"'Share Tech Mono',monospace",'font-weight':'bold'});
    idTxt.style.pointerEvents='none'; idTxt.style.transition='all .13s';
    idTxt.textContent=sec.id; g.appendChild(idTxt);
    const lbl=_svgEl('text',{x:lx,y:ly,'text-anchor':'middle','dominant-baseline':'middle',
      fill:sc,'font-size':'10','font-family':"'Barlow Condensed','Exo 2',sans-serif",'font-weight':'700','letter-spacing':'.8'});
    lbl.style.pointerEvents='none'; lbl.style.transition='all .13s';
    lbl.textContent=sec.label; g.appendChild(lbl);
    if(sec.branch){
      const[ax,ay]=_pt(_LR+13,mid);
      const arr=_svgEl('text',{x:ax,y:ay,'text-anchor':'middle','dominant-baseline':'middle',
        fill:sc,opacity:'.5','font-size':'9','font-family':"'Share Tech Mono',monospace"});
      arr.style.pointerEvents='none'; arr.textContent='›'; g.appendChild(arr);
    }
    _rSlicesG.appendChild(g);
    els.push({g,glow,arc,idTxt,lbl,data:sec,s,e,mid,col:sc,dark:sd,gradId});
  });
  return els;
}

function _radSetHov(idx){
  _radHov=idx;
  _radEls.forEach(({glow,arc,idTxt,lbl,data,s,e,col,dark,gradId},i)=>{
    const act=i===idx;
    glow.style.display=act?'block':'none';
    arc.setAttribute('d',_arcPath(s,e,act?_OR+8:_OR,_IR));
    arc.setAttribute('fill',act?`url(#${gradId})`:dark);
    arc.setAttribute('stroke-width',act?'1.6':'.45');
    arc.setAttribute('filter',act?'url(#r-glow)':'');
    idTxt.setAttribute('fill',act?'#fff':col);
    idTxt.setAttribute('opacity',act?'1':'.6');
    idTxt.setAttribute('filter',act?'url(#r-gsm)':'');
    lbl.setAttribute('fill',act?'#fff':col);
    lbl.setAttribute('font-weight',act?'800':'700');
  });
  if(idx!==null&&_radEls[idx]){
    const{mid}=_radEls[idx];
    const[ex,ey]=_pt(_OR-5,mid);
    _rIndicator.setAttribute('x2',_f(ex)); _rIndicator.setAttribute('y2',_f(ey));
    _rIndicator.setAttribute('display','block');
  } else {
    _rIndicator.setAttribute('display','none');
  }
}

function _radSetCenter(top,bot,col){
  col=col||'#888';
  _rCenterTop.textContent=top||''; _rCenterBot.textContent=bot||'';
  _rCenterTop.setAttribute('opacity',top?'1':'0');
  _rCenterBot.setAttribute('opacity',bot?'1':'0');
  _rCenterTop.setAttribute('fill',col);
  _rCenterDisc.setAttribute('stroke',col);
  _rPulseRing.setAttribute('stroke',col);
  _rIndicator.setAttribute('stroke',col);
}

function _radGetAD(e){
  const svg=document.getElementById('r-svg');
  const rect=svg.getBoundingClientRect();
  const t=e.changedTouches?.[0]??e.touches?.[0]??e;
  const px=((t.clientX-rect.left)/rect.width)*320;
  const py=((t.clientY-rect.top)/rect.height)*320;
  let a=(Math.atan2(py-_CY,px-_CX)*180)/Math.PI+90;
  if(a<0)a+=360;
  return{a,dist:Math.hypot(px-_CX,py-_CY)};
}

function _radAngToSlice(angle,n){
  return Math.floor((((angle%360)+360)%360)/(360/n))%n;
}

function _radTransitionTo(menuKey,pushStack){
  const def=RADIAL_DEFS[menuKey]; if(!def) return;
  const col=def.color||'#888';
  if(pushStack&&_radMenu) _radStack.push(_radMenu);
  const prevEls=_radEls.slice();
  prevEls.forEach(({g})=>{g.classList.remove('r-sector-in');g.classList.add('r-sector-out');});
  setTimeout(()=>prevEls.forEach(({g})=>{if(g.parentNode)g.parentNode.removeChild(g);}),220);
  _radMenu=menuKey; _radHov=null;
  _rTrack1.setAttribute('opacity','1'); _rTrack2.setAttribute('opacity','1');
  _rCenterDisc.setAttribute('opacity','1');
  const sideTag=_radSide==='L'?'L · ':'R · ';
  _radSetCenter(sideTag+def.label, _radStack.length?'↩  BACK':'TAP  ·  SLIDE', col);
  _rIndicator.setAttribute('display','none');
  _radEls=_radBuildSlices(menuKey);
  _radEls.forEach(({g},i)=>{
    g.style.display='block'; g.style.opacity='0';
    setTimeout(()=>{g.classList.add('r-sector-in');g.style.opacity='1';},80+i*45);
  });
}

function _radGoBack(){
  if(_radStack.length>0){
    _radTransitionTo(_radStack.pop(),false);
  } else {
    closePie(_radSide);
  }
}

function _radConfirmSector(){
  if(_radHov===null||!_radEls[_radHov]) return;
  const sec=_radEls[_radHov].data, side=_radSide;
  _rPulseRing.setAttribute('opacity','1');
  _rPulseRing.classList.remove('r-pulse-anim');
  void _rPulseRing.offsetWidth;
  _rPulseRing.classList.add('r-pulse-anim');
  setTimeout(()=>_rPulseRing.setAttribute('opacity','0'),700);
  let actionId;
  if(sec.actionId!==undefined){actionId=sec.actionId;}
  else{const base=side==='L'?100:200; actionId=base+sec.offset;}
  setTimeout(()=>{closePie(side, false); showConfirm(side,actionId);},130);
}

function _radPtrDown(e){
  if(_radPhase==='idle') return; e.preventDefault();
  document.getElementById('r-svgwrap').setPointerCapture(e.pointerId);
  const{a,dist}=_radGetAD(e);
  if(dist<_IR*0.55){_radGoBack();return;}
  const n=_radEls.length;
  if(n>0)_radSetHov(dist<_IR?null:_radAngToSlice(a,n));
}

function _radPtrMove(e){
  if(_radPhase==='idle') return; e.preventDefault();
  const{a,dist}=_radGetAD(e);
  const n=_radEls.length;
  if(n>0)_radSetHov(dist<_IR*0.55?null:_radAngToSlice(a,n));
}

function _radPtrUp(e){
  if(_radPhase==='idle') return; e.preventDefault();
  const{dist}=_radGetAD(e);
  if(dist<_IR){_radGoBack();return;}
  if(_radHov===null||!_radEls[_radHov]) return;
  const sec=_radEls[_radHov].data;
  if(sec.branch){_radTransitionTo(sec.branch,true);}
  else{_radConfirmSector();}
}

function openPie(side){
  stopTimer();
  _radSide=side; _radPhase='main'; _radStack=[]; _radHov=null; _radEls=[]; _radMenu=null;
  const ov=document.getElementById('radial-overlay');
  ov.style.display='flex'; ov.style.opacity='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.style.opacity='1'));
  _rTrack1.setAttribute('opacity','0'); _rTrack2.setAttribute('opacity','0');
  _rCenterDisc.setAttribute('opacity','0');
  _rCenterTop.setAttribute('opacity','0'); _rCenterBot.setAttribute('opacity','0');
  _rPulseRing.setAttribute('opacity','0');
  _rIndicator.setAttribute('display','none');
  while(_rSlicesG.firstChild)_rSlicesG.removeChild(_rSlicesG.firstChild);
  _radTransitionTo('MAIN',false);
}

function closePie(side, resume = true){
  _radPhase='idle'; _radHov=null; _radStack=[]; _radMenu=null; _radSide=null; _radEls=[];
  const ov=document.getElementById('radial-overlay');
  ov.style.opacity='0';
  setTimeout(()=>{
    ov.style.display='none';
    while(_rSlicesG.firstChild)_rSlicesG.removeChild(_rSlicesG.firstChild);
  },220);
  if(resume&&M&&!M.finished)startTimer();
}

(function initRadial(){
  _rSlicesG   =document.getElementById('r-slices');
  _rCenterDisc=document.getElementById('r-center-disc');

let _pendingAction = null;

// Actions where Hit/Off-Target doesn't apply — just a plain confirm
const NO_HIT_CHOICE = new Set([1, 2, 3, 124, 224, 190, 191, 290, 291]);

function showConfirm(side, actionId) {
  _pendingAction = {side, actionId};
  const action   = ACTIONS[actionId];
  const s        = side === 'L' ? 'l' : 'r';
  const needsChoice = action && !NO_HIT_CHOICE.has(actionId);

  document.getElementById(`conf-${s}-icon`).textContent  = action ? action.emoji : '?';
  document.getElementById(`conf-${s}-label`).textContent = action ? action.label.toUpperCase() : '';
  document.getElementById(`conf-${s}-hit`).style.display       = needsChoice ? 'block' : 'none';
  document.getElementById(`conf-${s}-off`).style.display       = needsChoice ? 'block' : 'none';
  document.getElementById(`conf-${s}-yes`).style.display       = needsChoice ? 'none'  : 'block';
  document.getElementById(`conf-${s}`).classList.add('on');

  const hint = document.getElementById('hint-pill');
  hint.textContent = action ? action.label : '';
  hint.classList.add('on');
}

function hideConfirm() {
  document.getElementById('conf-l').classList.remove('on');
  document.getElementById('conf-r').classList.remove('on');
  document.getElementById('hint-pill').classList.remove('on');
  _pendingAction = null;
}

['l','r'].forEach(s => {
  const side = s === 'l' ? 'L' : 'R';
  // HIT
  document.getElementById(`conf-${s}-hit`).addEventListener('touchend', e => {
    e.preventDefault();
    if (_pendingAction) doConfirm(_pendingAction.side, _pendingAction.actionId, true);
    hideConfirm();
  }, {passive:false});
  // OFF TARGET
  document.getElementById(`conf-${s}-off`).addEventListener('touchend', e => {
    e.preventDefault();
    if (_pendingAction) doConfirm(_pendingAction.side, _pendingAction.actionId, false);
    hideConfirm();
  }, {passive:false});
  // Plain confirm (cards / ref actions)
  document.getElementById(`conf-${s}-yes`).addEventListener('touchend', e => {
    e.preventDefault();
    if (_pendingAction) doConfirm(_pendingAction.side, _pendingAction.actionId, _pendingAction.actionId > 10 ? false : false);
    hideConfirm();
  }, {passive:false});
  // Cancel
  document.getElementById(`conf-${s}-no`).addEventListener('touchend', e => {
    e.preventDefault(); hideConfirm(); if (!M.finished) startTimer();
  }, {passive:false});
});

// ── doConfirm — record action, update state ───────────────────────────────────
function doConfirm(side, actionId, isHit) {
  if (!M || M.finished) return;
  const action    = ACTIONS[actionId];
  const ts        = M.periodDuration - M.timerSec;
  const scored    = isHit === undefined ? (action ? action.isHit : false) : isHit;
  const ev        = { ts, side: action ? action.side : 'C', actionId,
                      label: action ? action.label : '?',
                      emoji: action ? action.emoji  : '?',
                      isHit: scored,
                      period: M.period };
  M.events.push(ev);
  // Stamp for overlay pill (shown on recording canvas for 3 s)
  _lastAction   = { emoji: ev.emoji, label: ev.label, side: ev.side, isHit: scored };
  _lastActionAt = performance.now();

  if (action) {
    if (scored) {
      if (side === 'L') { M.scoreL++; M.hpR = Math.max(0, M.hpR - 10); }
      else              { M.scoreR++; M.hpL = Math.max(0, M.hpL - 10); }
    }
    if (actionId === 190 || actionId === 191) {
      M.cardsL.push(action.emoji);
      if (actionId === 191) { M.scoreR++; M.hpL = Math.max(0, M.hpL - 5); }
    }
    if (actionId === 290 || actionId === 291) {
      M.cardsR.push(action.emoji);
      if (actionId === 291) { M.scoreL++; M.hpR = Math.max(0, M.hpR - 5); }
    }
  }

  refreshHUD();

  // Win condition: DE ends at 15 touches; poule at 5
  const maxScore = M.format === 'poule' ? 5 : 15;
  if (!isImportedVideoAnnotationMode() && (M.scoreL >= maxScore || M.scoreR >= maxScore)) { finishMatch(); return; }
  if (!M.finished) startTimer();
}

// ── Events list render ────────────────────────────────────────────────────────
function renderEventsList() {
  document.getElementById('ev-name-l').textContent  = M.nameL;
  document.getElementById('ev-name-r').textContent  = M.nameR;
  document.getElementById('ev-score-l').textContent = M.scoreL;
  document.getElementById('ev-score-r').textContent = M.scoreR;
  const list = document.getElementById('ev-list');
  list.innerHTML = '';
  M.events.forEach(ev => {
    const item  = document.createElement('div');
    item.className = 'ev-item';
    const side  = ev.side === 'L' ? 'l' : ev.side === 'R' ? 'r' : 'c';
    const bubble = document.createElement('div');
    bubble.className = `ev-bubble ev-${side}`;
    bubble.innerHTML =
      `<span class="ev-ts">${fmtTime(ev.ts)}</span>` +
      `<span style="font-size:16px">${ev.emoji}</span>` +
      `<span class="ev-hint">${ev.label}</span>`;
    item.appendChild(bubble);
    list.appendChild(item);
  });
  list.scrollTop = list.scrollHeight;
}

function pickMime() {
  const candidates = [
    'video/webm;codecs=vp8,opus',
    'video/webm;codecs=vp9,opus',
    'video/webm',
  ];
  if (typeof MediaRecorder === 'undefined') return '';
  return candidates.find(m => MediaRecorder.isTypeSupported(m)) || '';
}

function camExt() {
  return _mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';
}

function showCamError(msg) {
  const pill = document.getElementById('hint-pill');

}

function resetCamUI() {
  if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
  _recCanvas = null;
  _recCtx    = null;
  const btn    = document.getElementById('cam-btn');
  const prev   = document.getElementById('cam-preview');
  const recDot = document.getElementById('rec-dot');
  btn.textContent = '📷';
  btn.classList.remove('recording');
  prev.classList.remove('on');
  prev.srcObject = null;
  recDot.classList.remove('on');
  _camState  = 'idle';
  _camStream = null;
  _mediaRec  = null;
  _recChunks = [];
  _recPerfStart = null;
  _recPauseOpen = null;
}

function setImportVideoStatus(msg) {
  const setupStatus = document.getElementById('setup-video-status');
  if (setupStatus) setupStatus.textContent = msg || '';
}

function openVideoPicker() {
  document.getElementById('video-input').click();
}

function attachImportedVideoPreview(reset = false) {
  const preview = document.getElementById('import-preview');
  if (!preview || !_importVideoFile) return null;
  if (!_importVideoUrl) _importVideoUrl = URL.createObjectURL(_importVideoFile);
  if (preview.src !== _importVideoUrl) preview.src = _importVideoUrl;
  preview.classList.add('on');
  if (reset) {
    try { preview.currentTime = 0; } catch (_) {}
  }
  return preview;
}

function pauseImportedVideo() {
  const preview = document.getElementById('import-preview');
  if (preview) preview.pause();
}

function resumeImportedVideo() {
  if (!_importVideoFile || !M || !M.running) return;
  const preview = attachImportedVideoPreview(false);
  if (!preview || document.getElementById('s-match').classList.contains('active') === false) return;
  const p = preview.play();
  if (p && typeof p.catch === 'function') p.catch(() => {});
}

function resetImportedVideo(clearFile = false) {
  const preview = document.getElementById('import-preview');
  if (preview) {
    preview.pause();
    preview.classList.remove('on');
    preview.removeAttribute('src');
    preview.load();
  }
  if (_importVideoUrl) {
    URL.revokeObjectURL(_importVideoUrl);
    _importVideoUrl = null;
  }
  if (clearFile) {
    _importVideoFile = null;
    const input = document.getElementById('video-input');
    if (input) input.value = '';
    setImportVideoStatus('');
  }
}

function isImportedVideoAnnotationMode() {
  return !!_importVideoFile;
}

function stopActiveRecording(opts = {}) {
  if (_recPauseOpen && M && Array.isArray(M.recordingPauses)) {
    _recPauseOpen.endVideo = recordingVideoElapsed();
    M.recordingPauses.push(_recPauseOpen);
    _recPauseOpen = null;
    if (typeof scheduleSave === 'function') scheduleSave();
  }
  if (_camState !== 'recording') return false;
  _autoStop = !!opts.autoStop;
  _camState = 'stopping';

  if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
  const btn = document.getElementById('cam-btn');
  const recDot = document.getElementById('rec-dot');
  btn.classList.remove('recording');
  btn.textContent = '📷';
  recDot.classList.remove('on');

  try {
    if (_mediaRec && _mediaRec.state === 'recording') {
      if (typeof _mediaRec.requestData === 'function') _mediaRec.requestData();
      _mediaRec.stop();
    }
  } catch (_) {
    resetCamUI();
  }

  if (_camStream) _camStream.getTracks().forEach(t => t.stop());
  return true;
}

function recordingVideoElapsed() {
  return _recPerfStart === null ? 0 : Math.max(0, (performance.now() - _recPerfStart) / 1000);
}

function ensureRecordingPauses() {
  if (!M) return [];
  if (!Array.isArray(M.recordingPauses)) M.recordingPauses = [];
  return M.recordingPauses;
}

function noteRecordingClockPause() {
  if (!M || _camState !== 'recording' || !M.running || _recPauseOpen) return;
  _recPauseOpen = {
    startVideo: recordingVideoElapsed(),
    boutTime: currentBoutElapsed(),
  };
}

function noteRecordingClockResume() {
  if (!_recPauseOpen || !M) return;
  _recPauseOpen.endVideo = recordingVideoElapsed();
  ensureRecordingPauses().push(_recPauseOpen);
  _recPauseOpen = null;
  if (typeof scheduleSave === 'function') scheduleSave();
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function drawHUDOverlay(ctx, W, H, opts) {
  if (!M) return;
  const includeAction = !opts || opts.includeAction !== false;
  const hudH  = Math.round(H * 0.09);
  const pad   = Math.round(W * 0.012);
  const scoreW = Math.round(W * 0.042);
  const hpW   = Math.round(W * 0.19);
  const hpH   = Math.round(H * 0.008);
  const hpY   = Math.round(hudH * 0.60);
  const nameY = Math.round(hudH * 0.35);

  // HUD background bar
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, hudH);

  // ── LEFT fencer ────────────────────────────────────────────────────────────
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#00c7ff';
  ctx.font = `bold ${Math.round(hudH * 0.52)}px monospace`;
  ctx.textAlign = 'left';
  ctx.fillText(M.scoreL, pad, hudH * 0.50);

  ctx.fillStyle = '#fff';
  ctx.font = `600 ${Math.round(hudH * 0.30)}px sans-serif`;
  ctx.fillText(M.nameL.substring(0, 12), pad + scoreW, nameY);

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(pad + scoreW, hpY, hpW, hpH);
  ctx.fillStyle = '#00c7ff';
  ctx.fillRect(pad + scoreW, hpY, hpW * (M.hpL / 100), hpH);

  // ── RIGHT fencer ───────────────────────────────────────────────────────────
  ctx.fillStyle = '#e62600';
  ctx.font = `bold ${Math.round(hudH * 0.52)}px monospace`;
  ctx.textAlign = 'right';
  ctx.fillText(M.scoreR, W - pad, hudH * 0.50);

  ctx.fillStyle = '#fff';
  ctx.font = `600 ${Math.round(hudH * 0.30)}px sans-serif`;
  ctx.fillText(M.nameR.substring(0, 12), W - pad - scoreW, nameY);

  const hpRX = W - pad - scoreW - hpW;
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(hpRX, hpY, hpW, hpH);
  ctx.fillStyle = '#e62600';
  const hpRFill = M.hpR / 100;
  ctx.fillRect(hpRX + hpW * (1 - hpRFill), hpY, hpW * hpRFill, hpH);

  // ── TIMER centre ───────────────────────────────────────────────────────────
  ctx.fillStyle = M.timerSec <= 30 ? '#e62600' : '#f5c842';
  ctx.font = `bold ${Math.round(hudH * 0.44)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(fmtTime(M.timerSec), W / 2, hudH * 0.42);

  ctx.fillStyle = 'rgba(255,255,255,0.50)';
  ctx.font = `${Math.round(hudH * 0.22)}px monospace`;
  ctx.fillText('P' + M.period, W / 2, hudH * 0.76);

  // ── CARDS ──────────────────────────────────────────────────────────────────
  ctx.textBaseline = 'top';
  if (M.cardsL.length) {
    ctx.font = `${Math.round(H * 0.04)}px serif`;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText(M.cardsL.join(' '), pad, hudH + 6);
  }
  if (M.cardsR.length) {
    ctx.font = `${Math.round(H * 0.04)}px serif`;
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.fillText(M.cardsR.join(' '), W - pad, hudH + 6);
  }

  // ── LAST ACTION pill (fades out after 3 s) ─────────────────────────────────
  const elapsed = performance.now() - _lastActionAt;
  if (includeAction && _lastAction && elapsed < 3000) {
    const alpha  = elapsed < 2400 ? 1 : 1 - (elapsed - 2400) / 600;
    const fSize  = Math.round(H * 0.033);
    const txt    = _lastAction.emoji + '  ' + _lastAction.label +
                   (_lastAction.isHit ? '' : '  [OFF TARGET]');
    ctx.font = `bold ${fSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const tw = ctx.measureText(txt).width;
    const pw = tw + 44, ph = fSize * 2.2;
    const py = H * 0.82;

    ctx.globalAlpha = alpha * 0.88;
    ctx.fillStyle   = '#07080c';
    rrect(ctx, W / 2 - pw / 2, py - ph / 2, pw, ph, ph / 2);
    ctx.fill();

    // Side colour bar on left edge of pill
    const sideCol = _lastAction.side === 'L' ? '#00c7ff' :
                    _lastAction.side === 'R' ? '#e62600' : '#f5c842';
    ctx.globalAlpha = alpha;
    ctx.fillStyle   = sideCol;
    rrect(ctx, W / 2 - pw / 2, py - ph / 2, 5, ph, 3);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.fillText(txt, W / 2, py);
    ctx.globalAlpha = 1;
  }
}

function drawActionPill(ctx, W, H, ev, alpha) {
  if (!ev) return;
  const sideCol = ev.side === 'L' ? '#00c7ff' : ev.side === 'R' ? '#e62600' : '#f5c842';
  const sideName = ev.side === 'L' ? 'LEFT' : ev.side === 'R' ? 'RIGHT' : 'REFEREE';
  const action = String(ev.label || 'ACTION').toUpperCase();
  const result = ev.isHit ? 'TOUCH' : 'OFF TARGET';
  const titleSize = Math.max(24, Math.round(H * 0.047));
  const metaSize = Math.max(13, Math.round(H * 0.018));
  const resultSize = Math.max(14, Math.round(H * 0.021));
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.font = `900 ${titleSize}px sans-serif`;
  const actionWidth = ctx.measureText(action).width;
  ctx.font = `900 ${resultSize}px sans-serif`;
  const resultWidth = ctx.measureText(result).width + 34;
  const pw = Math.min(W - 32, Math.max(W * 0.45, actionWidth + resultWidth + 86));
  const ph = Math.max(86, titleSize * 2.45);
  const x = W / 2 - pw / 2;
  const y = H * 0.77 - ph / 2;
  const radius = 14;

  ctx.globalAlpha = alpha;
  ctx.shadowColor = 'rgba(0,0,0,.75)';
  ctx.shadowBlur = 24;
  ctx.shadowOffsetY = 7;
  ctx.fillStyle = 'rgba(2, 4, 10, .93)';
  rrect(ctx, x, y, pw, ph, radius);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  ctx.strokeStyle = sideCol;
  ctx.lineWidth = 3;
  rrect(ctx, x + 1.5, y + 1.5, pw - 3, ph - 3, radius);
  ctx.stroke();

  ctx.fillStyle = sideCol;
  rrect(ctx, x, y, 8, ph, radius);
  ctx.fill();

  ctx.font = `800 ${metaSize}px sans-serif`;
  ctx.fillStyle = sideCol;
  ctx.fillText(`${sideName} ACTION`, W / 2, y + 20);

  ctx.font = `900 ${titleSize}px sans-serif`;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,.9)';
  ctx.lineWidth = 5;
  ctx.strokeText(action, W / 2, y + ph / 2 + 4, pw - resultWidth - 42);
  ctx.fillText(action, W / 2, y + ph / 2 + 4, pw - resultWidth - 42);

  const bx = x + pw - resultWidth - 18;
  const by = y + ph - 35;
  ctx.fillStyle = ev.isHit ? sideCol : 'rgba(255, 206, 84, .95)';
  rrect(ctx, bx, by - 14, resultWidth, 28, 14);
  ctx.fill();
  ctx.font = `900 ${resultSize}px sans-serif`;
  ctx.fillStyle = ev.isHit ? '#02040a' : '#221600';
  ctx.fillText(result, bx + resultWidth / 2, by + 1);
  ctx.restore();
}

function overlayEventTime(ev) {
  const period = Math.max(1, Number(ev.period) || 1);
  return (period - 1) * (Number(M.periodDuration) || 0) + (Number(ev.ts) || 0);
}

function currentBoutElapsed() {
  if (!M) return 0;
  return (Math.max(1, Number(M.period) || 1) - 1) * (Number(M.periodDuration) || 0) +
         ((Number(M.periodDuration) || 0) - (Number(M.timerSec) || 0));
}

function videoTimeToBoutTime(videoTime, timeOffset, useRecordingPauses) {
  const t = Number(videoTime) || 0;
  let boutTime = t + (Number(timeOffset) || 0);
  if (!useRecordingPauses || !M || !Array.isArray(M.recordingPauses)) return boutTime;

  const pauses = M.recordingPauses
    .map(p => ({
      startVideo: Number(p.startVideo),
      endVideo: Number(p.endVideo),
      boutTime: Number(p.boutTime),
    }))
    .filter(p => Number.isFinite(p.startVideo) && Number.isFinite(p.endVideo) && p.endVideo > p.startVideo)
    .sort((a, b) => a.startVideo - b.startVideo);

  let pausedTotal = 0;
  let cursor = 0;
  for (const p of pauses) {
    const start = Math.max(p.startVideo, cursor);
    const end = Math.max(p.endVideo, start);
    if (end <= start) continue;
    if (t <= start) break;

    const timelineBoutAtPauseStart = start + (Number(timeOffset) || 0) - pausedTotal;
    const storedBout = Number.isFinite(p.boutTime) ? p.boutTime : timelineBoutAtPauseStart;
    const freezeBout = Math.max(storedBout, timelineBoutAtPauseStart);

    if (t < end) return freezeBout;
    pausedTotal += end - start;
    cursor = end;
  }
  return boutTime - pausedTotal;
}

function markRecordingStart(boutElapsed) {
  _recBoutStart = Number.isFinite(Number(boutElapsed)) ? Number(boutElapsed) : currentBoutElapsed();
  _recPerfStart = performance.now();
  _recPauseOpen = null;
  if (M) {
    M.recordingStartBoutTs = _recBoutStart;
    M.recordingStartPeriod = Math.max(1, Number(M.period) || 1);
    M.recordingStartPeriodTs = _recBoutStart - (M.recordingStartPeriod - 1) * (Number(M.periodDuration) || 0);
    M.recordingPauses = [];
    if (typeof scheduleSave === 'function') scheduleSave();
  }
  return _recBoutStart;
}

async function prepareRecordingBeforeStart() {
  try {
    if (_camState === 'idle') await toggleCamera();
    if (_camState === 'preview') {
      await toggleCamera();
      if (_camState === 'recording') markRecordingStart(-START_COUNTDOWN_SECONDS);
    }
  } catch (_) {
    // Camera setup is best-effort; the bout should still start if permissions fail.
  }
}

function drawImportedOverlay(ctx, W, H, currentTime, timeOffset, useRecordingPauses) {
  if (!M || !M.events) return;
  const boutTime = videoTimeToBoutTime(currentTime, timeOffset, useRecordingPauses);
  const visible = M.events
    .map(ev => ({ ev, t: overlayEventTime(ev) }))
    .filter(x => boutTime >= x.t && boutTime < x.t + 3)
    .pop();
  if (!visible) return;
  const elapsed = boutTime - visible.t;
  const alpha = elapsed < 2.4 ? 1 : Math.max(0, 1 - (elapsed - 2.4) / 0.6);
  drawActionPill(ctx, W, H, visible.ev, alpha);
}

function replayStateAt(boutTime, events) {
  const periodDuration = Number(M?.periodDuration) || 180;
  const totalPeriods = Number(M?.totalPeriods) || 1;
  const period = Math.min(totalPeriods, Math.max(1, Math.floor(boutTime / periodDuration) + 1));
  const periodElapsed = Math.max(0, boutTime - (period - 1) * periodDuration);
  const state = {
    nameL: M?.nameL || 'LEFT',
    nameR: M?.nameR || 'RIGHT',
    scoreL: 0, scoreR: 0,
    hpL: 100, hpR: 100,
    cardsL: [], cardsR: [],
    timerSec: Math.max(0, periodDuration - Math.floor(periodElapsed)),
    period,
  };
  (events || M?.events || []).forEach(ev => {
    if (overlayEventTime(ev) > boutTime) return;
    if (ev.isHit) {
      if (ev.side === 'L') { state.scoreL++; state.hpR = Math.max(0, state.hpR - 10); }
      if (ev.side === 'R') { state.scoreR++; state.hpL = Math.max(0, state.hpL - 10); }
    }
    if (ev.actionId === 190 || ev.actionId === 191) {
      state.cardsL.push(ev.emoji);
      if (ev.actionId === 191) { state.scoreR++; state.hpL = Math.max(0, state.hpL - 5); }
    }
    if (ev.actionId === 290 || ev.actionId === 291) {
      state.cardsR.push(ev.emoji);
      if (ev.actionId === 291) { state.scoreL++; state.hpR = Math.max(0, state.hpR - 5); }
    }
  });
  return state;
}

function drawReplayHUDOverlay(ctx, W, H, currentTime, timeOffset, useRecordingPauses) {
  if (!M) return;
  const state = replayStateAt(videoTimeToBoutTime(currentTime, timeOffset, useRecordingPauses));
  const saved = M;
  try {
    M = { ...M, ...state };
    drawHUDOverlay(ctx, W, H, { includeAction: false });
  } finally {
    M = saved;
  }
}

async function toggleCamera() {
  if (_camState === 'stopping') return;
  const btn     = document.getElementById('cam-btn');
  const preview = document.getElementById('cam-preview');
  const recDot  = document.getElementById('rec-dot');

  // ── IDLE → PREVIEW ──────────────────────────────────────────────────────────
  if (_camState === 'idle') {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showCamError('Camera not supported in this browser'); return;
    }
    try {
      _camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
        audio: true,
      });
      _mimeType = pickMime();
      preview.srcObject = _camStream;
      // play() is required on some Android WebViews even with autoplay attr
      await preview.play().catch(() => {});
      preview.classList.add('on');
      btn.textContent = '⏺';
      _camState = 'preview';
    } catch (err) {
      const msg = err.name === 'NotAllowedError'  ? 'Permission denied' :
                  err.name === 'NotFoundError'     ? 'No camera found'   :
                  err.name === 'NotReadableError'  ? 'Camera in use'     :
                  'Camera unavailable';
      showCamError(msg);
      resetCamUI();
    }
    return;
  }

  // ── PREVIEW → RECORDING ─────────────────────────────────────────────────────
  if (_camState === 'preview') {
    if (typeof MediaRecorder === 'undefined') {
      showCamError('Recording not supported — preview only'); return;
    }

    // Build offscreen canvas that composites camera + HUD overlay
    _recCanvas = document.createElement('canvas');
    _recCanvas.width  = 1280;
    _recCanvas.height = 720;
    _recCtx = _recCanvas.getContext('2d');

    const drawFrame = () => {
      if (!_recCtx) return;
      _recCtx.drawImage(preview, 0, 0, 1280, 720);
      _rafId = requestAnimationFrame(drawFrame);
    };
    drawFrame();

    // Canvas video stream + original audio tracks
    let recStream;
    try {
      recStream = _recCanvas.captureStream(30);
      _camStream.getAudioTracks().forEach(t => recStream.addTrack(t));
    } catch (_) {
      recStream = _camStream; // captureStream not supported — fall back
    }

    _recChunks = [];
    try {
      _mediaRec = _mimeType
        ? new MediaRecorder(recStream, { mimeType: _mimeType })
        : new MediaRecorder(recStream);
    } catch (_) {
      _mediaRec = new MediaRecorder(recStream);
    }
    _mediaRec.ondataavailable = e => { if (e.data && e.data.size) _recChunks.push(e.data); };
    _mediaRec.onerror = () => { showCamError('Recording error — stopping'); resetCamUI(); };
    _mediaRec.onstop = () => {
      if (_recChunks.length === 0) { showCamError('No data recorded'); resetCamUI(); return; }
      const mime = _mimeType || 'video/webm';
      _recBlob = new Blob(_recChunks, { type: mime });
      const shouldExportNow = !_autoStop;
      _autoStop = false;
      resetCamUI();
      if (shouldExportNow) exportVideo();
    };
    markRecordingStart();
    _mediaRec.start(1000);
    recDot.classList.add('on');
    btn.classList.add('recording');
    btn.textContent = '⏹';
    _camState = 'recording';
    return;
  }

  // ── RECORDING → STOP + SAVE ─────────────────────────────────────────────────
  if (_camState === 'recording') {
    stopActiveRecording({ autoStop: false });
  }
}

document.getElementById('cam-btn').addEventListener('touchend', e => {
  e.preventDefault(); toggleCamera();
}, {passive:false});

// ── Exports ───────────────────────────────────────────────────────────────────
function safeFilePart(s) {
  return String(s || 'match').replace(/[^\w.-]+/g, '-').replace(/^-+|-+$/g, '') || 'match';
}

function _downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function shareOrDownload(blob, filename) {
  const file = new File([blob], filename, { type: blob.type || 'application/octet-stream' });
  if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) {
    try { await navigator.share({ files: [file], title: filename }); return; }
    catch (err) { if (err && err.name === 'AbortError') return; }
  }
  _downloadBlob(blob, filename);
}

function overlayFilename(source, ext) {
  return `match-${safeFilePart(M.nameL)}-vs-${safeFilePart(M.nameR)}-${source}-${Date.now()}.${ext}`;
}

function setOverlayStatus(msg, busy) {
  const status = document.getElementById('overlay-status');
  const importBtn = document.getElementById('imp-video');
  const setupImportBtn = document.getElementById('btn-import-video');
  const exportBtn = document.getElementById('exp-overlay');
  if (status) status.textContent = msg || '';
  if (importBtn) importBtn.disabled = !!busy;
  if (setupImportBtn) setupImportBtn.disabled = !!busy;
  if (exportBtn) {
    exportBtn.disabled = !!busy;
    exportBtn.textContent = busy ? 'Rendering…' : '⬇ Export Overlay';
  }
}

function videoDimensions(video) {
  const srcW = video.videoWidth || 1280;
  const srcH = video.videoHeight || 720;
  const maxEdge = 1280;
  const scale = Math.min(1, maxEdge / Math.max(srcW, srcH));
  return {
    width: Math.max(2, Math.round(srcW * scale)),
    height: Math.max(2, Math.round(srcH * scale)),
  };
}

function waitForEvent(target, name) {
  return new Promise((resolve, reject) => {
    target.addEventListener(name, resolve, { once: true });
    target.addEventListener('error', () => reject(new Error('Could not read the imported video')), { once: true });
  });
}

function snapshotMatchForOverlay(match) {
  if (!match) return null;
  try {
    return typeof structuredClone === 'function'
      ? structuredClone(match)
      : JSON.parse(JSON.stringify(match));
  } catch (_) {
    return { ...match, events: (match.events || []).map(ev => ({ ...ev })) };
  }
}

async function renderOverlayVideo(file, source, opts) {
  if (!M) throw new Error('No match loaded');
  if (!file) throw new Error('Import a video first');
  if (typeof MediaRecorder === 'undefined') throw new Error('Overlay export is not supported in this browser');
  const renderMatch = snapshotMatchForOverlay(M);
  if (!renderMatch) throw new Error('No match loaded');
  const timeOffset = opts && Number(opts.timeOffset) ? Number(opts.timeOffset) : 0;
  const useRecordingPauses = !!(opts && opts.useRecordingPauses);

  const video = document.createElement('video');
  const url = URL.createObjectURL(file);
  video.src = url;
  video.playsInline = true;
  video.preload = 'auto';
  video.muted = true;
  video.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
  document.body.appendChild(video);

  try {
    await waitForEvent(video, 'loadedmetadata');
    const dim = videoDimensions(video);
    const canvas = document.createElement('canvas');
    canvas.width = dim.width;
    canvas.height = dim.height;
    const ctx = canvas.getContext('2d');
    if (!ctx || !canvas.captureStream) throw new Error('Canvas video capture is not supported in this browser');

    const stream = canvas.captureStream(30);
    const videoCapture = video.captureStream ? video.captureStream() :
                         video.mozCaptureStream ? video.mozCaptureStream() : null;
    let audioPreserved = false;
    if (videoCapture) {
      videoCapture.getAudioTracks().forEach(track => {
        stream.addTrack(track);
        audioPreserved = true;
      });
    }

    const mimeType = pickMime();
    const chunks = [];
    let recorder;
    const recorderOpts = { videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 };
    try {
      recorder = new MediaRecorder(stream, mimeType ? { ...recorderOpts, mimeType } : recorderOpts);
    } catch (_) {
      recorder = mimeType
        ? new MediaRecorder(stream, { mimeType })
        : new MediaRecorder(stream);
    }
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };

    const stopped = new Promise((resolve, reject) => {
      recorder.onstop = resolve;
      recorder.onerror = () => reject(new Error('Overlay recording failed'));
    });

    let drawTimer = null;
    let videoFrameCallback = null;
    const drawFrame = () => {
      if (video.ended) return;
      ctx.drawImage(video, 0, 0, dim.width, dim.height);
      const liveMatch = M;
      try {
        M = renderMatch;
        drawReplayHUDOverlay(ctx, dim.width, dim.height, video.currentTime, timeOffset, useRecordingPauses);
        drawImportedOverlay(ctx, dim.width, dim.height, video.currentTime, timeOffset, useRecordingPauses);
      } finally {
        M = liveMatch;
      }
    };

    recorder.start(1000);
    await video.play();
    drawFrame();
    if (typeof video.requestVideoFrameCallback === 'function') {
      const onVideoFrame = () => {
        drawFrame();
        if (!video.ended) videoFrameCallback = video.requestVideoFrameCallback(onVideoFrame);
      };
      videoFrameCallback = video.requestVideoFrameCallback(onVideoFrame);
    } else {
      const onAnimationFrame = () => {
        drawFrame();
        if (!video.ended) drawTimer = requestAnimationFrame(onAnimationFrame);
      };
      drawTimer = requestAnimationFrame(onAnimationFrame);
    }
    await waitForEvent(video, 'ended');
    if (videoFrameCallback && typeof video.cancelVideoFrameCallback === 'function') video.cancelVideoFrameCallback(videoFrameCallback);
    if (drawTimer) cancelAnimationFrame(drawTimer);
    drawFrame();
    if (typeof recorder.requestData === 'function') recorder.requestData();
    recorder.stop();
    await stopped;

    const type = recorder.mimeType || mimeType || 'video/webm';
    const blob = new Blob(chunks, { type });
    if (!blob.size) throw new Error('No overlay video data was produced');
    const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm';
    if (!audioPreserved) setOverlayStatus('Overlay rendered. Source audio could not be preserved on this browser.', false);
    return {
      blob,
      filename: overlayFilename(source, ext),
      mimeType: type,
      matchId: renderMatch.matchId || null,
      createdAt: Date.now(),
      duration: video.duration || null,
      source,
    };
  } finally {
    video.pause();
    document.body.removeChild(video);
    URL.revokeObjectURL(url);
  }
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(M, null, 2)], {type:'application/json'});
  shareOrDownload(blob, overlayFilename('events', 'json'));
}

function exportCSV() {
  const rows = ['ts,side,actionId,label,isHit,period'];
  M.events.forEach(ev => {
    rows.push([ev.ts,ev.side,ev.actionId,`"${ev.label}"`,ev.isHit,ev.period].join(','));
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  shareOrDownload(blob, overlayFilename('events', 'csv'));
}

function exportTXT() {
  let txt = `UFL FENCING — ${M.nameL} vs ${M.nameR}\n`;
  txt += `Weapon: ${M.weapon.toUpperCase()}  Format: ${M.format}\n`;
  txt += `Final: ${M.scoreL} – ${M.scoreR}\n\n`;
  M.events.forEach(ev => {
    txt += `[${fmtTime(ev.ts)}] P${ev.period}  ${ev.emoji} ${ev.side === 'L' ? M.nameL : ev.side === 'R' ? M.nameR : 'REF'}: ${ev.label}\n`;
  });
  const blob = new Blob([txt], {type:'text/plain'});
  shareOrDownload(blob, overlayFilename('report', 'txt'));
}

function exportVideo() {
  if (!_recBlob) return;
  const start = M && M.recordingStartBoutTs !== null && M.recordingStartBoutTs !== undefined
    ? Number(M.recordingStartBoutTs)
    : _recBoutStart;
  exportRenderedOverlay(_recBlob, 'recorded', { timeOffset: start, useRecordingPauses: true });
}

async function exportRenderedOverlay(file, source, opts) {
  if (_isRenderingOverlay) return;
  _isRenderingOverlay = true;
  setOverlayStatus('Rendering overlay video. Keep this screen open.', true);
  try {
    const rendered = await renderOverlayVideo(file, source, opts);
    if (document.getElementById('overlay-status').textContent === 'Rendering overlay video. Keep this screen open.') {
      setOverlayStatus('Overlay rendered.', false);
    }
    await shareOrDownload(rendered.blob, rendered.filename);
  } catch (err) {
    setOverlayStatus(err && err.message ? err.message : 'Overlay export failed', false);
  } finally {
    _isRenderingOverlay = false;
    const status = document.getElementById('overlay-status');
    if (status && status.textContent === 'Rendering overlay video. Keep this screen open.') {
      setOverlayStatus('', false);
    } else {
      setOverlayStatus(status ? status.textContent : '', false);
    }
  }
}

async function exportImportedOverlay() {
  exportRenderedOverlay(_importVideoFile, 'imported', { timeOffset: 0 });
}

function buildReport() {
  if (!M) return;
  const hitsL = M.events.filter(e=>e.side==='L'&&e.isHit).length;
  const hitsR = M.events.filter(e=>e.side==='R'&&e.isHit).length;
  document.getElementById('rpt-summary').innerHTML =
    `<div class="rpt-row"><span class="rpt-k">${M.nameL}</span><span class="rpt-v">${M.scoreL} pts, ${hitsL} hits</span></div>` +
    `<div class="rpt-row"><span class="rpt-k">${M.nameR}</span><span class="rpt-v">${M.scoreR} pts, ${hitsR} hits</span></div>` +
    `<div class="rpt-row"><span class="rpt-k">Total events</span><span class="rpt-v">${M.events.length}</span></div>` +
    `<div class="rpt-row"><span class="rpt-k">Duration</span><span class="rpt-v">${fmtTime(M.periodDuration - M.timerSec)}</span></div>`;

  // AI panel: confidence stubs
  const aiList = document.getElementById('ai-list');
  aiList.innerHTML = '';
  const recent = M.events.slice(-10).reverse();
  recent.forEach(ev => {
    const conf = ev.isHit ? 'h' : ev.side === 'C' ? 'm' : 'l';
    const name = ev.side==='L' ? M.nameL : ev.side==='R' ? M.nameR : 'REF';
    aiList.innerHTML +=
      `<div class="ai-row"><span class="ai-ts">${fmtTime(ev.ts)}</span>` +
      `<span class="ai-label">${ev.emoji} <b>${name}</b>: ${ev.label}</span>` +
      `<span class="conf conf-${conf}">${conf==='h'?'HIGH':conf==='m'?'MED':'LOW'}</span></div>`;
  });

  // ── Radar axes: every possible action, grouped by category ──────────────────
  const RADAR_AXES = [
    // OFFENSE
    {label:'Simple Att.', L:100, R:200},
    {label:'Compound',    L:101, R:201},
    {label:'Flèche',      L:102, R:202},
    {label:'Beat Att.',   L:103, R:203},
    {label:'Prise de Fer',L:104, R:204},
    // DEFENSE ROW
    {label:'Parry-Rip.',  L:110, R:210},
    {label:'Pt in Line',  L:112, R:212},
    {label:'Att on Prep', L:113, R:213},
    {label:'No-Att Tch',  L:114, R:214},
    // NONE / NO ROW
    {label:'Counterattk', L:120, R:220},
    {label:'Remise',      L:121, R:221},
    {label:'Continuation',L:122, R:222},
    {label:'Simultan.',   L:123, R:223, extra:[124]}, // pause-screen simultaneous also
  ];

  // Count events per axis per fencer
  const countL = {}, countR = {};
  M.events.forEach(ev => {
    countL[ev.actionId] = (countL[ev.actionId] || 0) + 1;
    countR[ev.actionId] = (countR[ev.actionId] || 0) + 1;
  });

  const valL = RADAR_AXES.map(ax =>
    (countL[ax.L] || 0) + (ax.extra ? ax.extra.reduce((s,id) => s + (countL[id]||0), 0) : 0)
  );
  const valR = RADAR_AXES.map(ax =>
    (countR[ax.R] || 0) + (ax.extra ? ax.extra.reduce((s,id) => s + (countR[id]||0), 0) : 0)
  );

  // ── Draw radar ────────────────────────────────────────────────────────────────
  const canvas = document.getElementById('radar-canvas');
  const ctx    = canvas.getContext('2d');
  const N   = RADAR_AXES.length;
  const CX  = 140, CY = 140, R = 100;
  ctx.clearRect(0, 0, 280, 280);

  const angle = i => (2 * Math.PI * i / N) - Math.PI / 2;
  const pt    = (i, r) => [CX + r * Math.cos(angle(i)), CY + r * Math.sin(angle(i))];
  const maxVal = Math.max(...valL, ...valR, 1);

  // Grid rings (3 levels)
  for (let ring = 1; ring <= 3; ring++) {
    const rr = R * ring / 3;
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const [x, y] = pt(i, rr);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Axis spokes + labels
  RADAR_AXES.forEach((ax, i) => {
    const [x, y] = pt(i, R);
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(x, y);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Label — nudge outward past the ring
    const [lx, ly] = pt(i, R + 16);
    ctx.font = 'bold 8px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText(ax.label.toUpperCase(), lx, ly);
  });

  // Draw filled polygon for one dataset
  function drawShape(vals, color, fillAlpha) {
    ctx.beginPath();
    vals.forEach((v, i) => {
      const r = (v / maxVal) * R;
      const [x, y] = pt(i, r);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = color.replace(')', `,${fillAlpha})`).replace('rgb','rgba');
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.stroke();
    // Dots
    vals.forEach((v, i) => {
      const r = (v / maxVal) * R;
      const [x, y] = pt(i, r);
      ctx.beginPath();
      ctx.arc(x, y, 3, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
    });
  }

  drawShape(valL, '#00c7ff', 0.18);
  drawShape(valR, '#e62600', 0.18);

  // Legend
  document.getElementById('radar-legend').innerHTML =
    `<span style="color:#00c7ff">■ ${M.nameL}</span>` +
    `<span style="color:#e62600">■ ${M.nameR}</span>`;

  // ── Tally table below radar ────────────────────────────────────────────────
  const statsEl = document.getElementById('stats-list');
  let rows = `<div style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;padding:4px 0 6px;border-bottom:1px solid var(--border);display:grid;grid-template-columns:1fr 28px 28px;gap:4px">
    <span>ACTION</span><span style="color:#00c7ff;text-align:right">${M.nameL.substring(0,4).toUpperCase()}</span><span style="color:#e62600;text-align:right">${M.nameR.substring(0,4).toUpperCase()}</span></div>`;
  RADAR_AXES.forEach((ax, i) => {
    const vl = valL[i], vr = valR[i];
    if (vl === 0 && vr === 0) return; // skip unused actions
    rows += `<div style="display:grid;grid-template-columns:1fr 28px 28px;gap:4px;padding:4px 0;border-bottom:1px solid var(--s2);font-size:12px">
      <span style="color:var(--text)">${ax.label}</span>
      <span style="color:#00c7ff;text-align:right;font-family:var(--mono)">${vl}</span>
      <span style="color:#e62600;text-align:right;font-family:var(--mono)">${vr}</span></div>`;
  });
  // Always show summary totals
  rows += `<div style="display:grid;grid-template-columns:1fr 28px 28px;gap:4px;padding:6px 0;font-size:12px;font-weight:700">
    <span style="color:var(--muted);font-family:var(--mono);font-size:10px">TOTAL ACTIONS</span>
    <span style="color:#00c7ff;text-align:right;font-family:var(--mono)">${valL.reduce((a,b)=>a+b,0)}</span>
    <span style="color:#e62600;text-align:right;font-family:var(--mono)">${valR.reduce((a,b)=>a+b,0)}</span></div>
    <div style="display:grid;grid-template-columns:1fr 28px 28px;gap:4px;padding:4px 0;font-size:12px">
    <span style="color:var(--muted);font-family:var(--mono);font-size:10px">CARDS</span>
    <span style="color:#00c7ff;text-align:right;font-family:var(--mono)">${M.cardsL.length}</span>
    <span style="color:#e62600;text-align:right;font-family:var(--mono)">${M.cardsR.length}</span></div>`;
  statsEl.innerHTML = rows;
}

document.getElementById('file-input').addEventListener('change', evt => {
  const file = evt.target.files[0]; if (!file) return;

    try {
      M = JSON.parse(ev.target.result);
      refreshHUD();

  reader.readAsText(file);
});

    if (group === 'fmt')  CFG.format   = val;
  }, {passive:false});
});
