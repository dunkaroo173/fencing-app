name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # No cache: gradle — we install Gradle manually below to avoid
          # conflicts with the GitHub cache service (HTTP 400 errors).

      # Download Gradle 8.4 directly from the Gradle distribution servers.
      # This avoids the GitHub Actions cache service entirely and is reliable.
      - name: Install Gradle 8.4
        run: |
          GRADLE_VERSION=8.4
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle version
        run: gradle --version

      # Accept pending Android SDK licences so aapt2/platform downloads don't stall.
      - name: Accept Android SDK licences
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || \
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses 2>/dev/null || true

      - name: Show Android SDK platforms
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" | tail -6

      - name: Validate project files
        run: |
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== app/build.gradle (deps section) ==="
          grep -A 20 '^dependencies' android/app/build.gradle

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -200
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: List APK outputs
        run: find android/app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "No APKs found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: s-class-fencing-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon 2>&1 | tail -100
        working-directory: android
        continue-on-error: true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: s-class-fencing-release-unsigned-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
