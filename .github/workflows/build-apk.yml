name: Build Android APK

on:
  push:
    branches: [main, claude/optimize-fencing-app-voice-xXiuq]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets
          cp ufl/ufl-mobile.html android/app/src/main/assets/index.html

      - name: Write local.properties (SDK path)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Diagnose AGP 8.13.0 availability
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/gradle/8.13.0/gradle-8.13.0.pom")
          echo "AGP 8.13.0 POM HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Google Maven returned HTTP $STATUS for AGP 8.13.0 — build may fail"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ufl-fencing-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
