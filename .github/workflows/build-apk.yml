name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Download Gradle directly — no GitHub cache service dependency.
      - name: Install Gradle 8.4
        run: |
          GRADLE_VERSION=8.4
          echo "Downloading Gradle ${GRADLE_VERSION}..."
          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o /tmp/gradle.zip
          echo "Downloaded $(du -sh /tmp/gradle.zip | cut -f1)"
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle
        run: gradle --version

      - name: Run tournament-engine unit tests
        run: gradle test --no-daemon
        working-directory: tournament-engine

      # Accept pending Android SDK licences.
      - name: Accept Android SDK licences
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses 2>/dev/null || \
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" \
            --licenses 2>/dev/null || true

      - name: Show environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" | tail -8
          java -version

      - name: Validate project files
        run: |
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== app/build.gradle (deps) ==="
          grep -A 25 '^dependencies' android/app/build.gradle

      # IMPORTANT: do NOT pipe gradle output — piping masks exit code.
      # GitHub Actions captures all stdout/stderr automatically.
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: List APK outputs
        if: always()
        run: |
          find android/app/build/outputs -name "*.apk" 2>/dev/null \
            && echo "---" \
            || echo "No APK files found under android/app/build/outputs"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: s-class-fencing-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon --stacktrace
        working-directory: android
        continue-on-error: true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: s-class-fencing-release-unsigned-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
