name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # The ubuntu-latest runner ships with the Android SDK; ANDROID_HOME is pre-set.
      # Accept any pending SDK licences so aapt2/platform downloads don't block.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Show Android SDK info
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms/" | tail -5

      - name: Validate Gradle files
        run: |
          echo "=== settings.gradle ==="
          cat android/settings.gradle
          echo ""
          echo "=== app/build.gradle ==="
          cat android/app/build.gradle

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: List generated APKs
        run: find android/app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "No APKs found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: s-class-fencing-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon
        working-directory: android
        continue-on-error: true
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: s-class-fencing-release-unsigned-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
